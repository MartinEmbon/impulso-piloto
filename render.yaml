services:
  - type: web
    name: impulso-empleo
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: ./data
      - key: INSTITUTION_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
